{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "turnstone.fullname" . }}-migrate
  labels:
    {{- include "turnstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Plain Helm: post-install, not pre-install -- on a first install nothing
    # the migration needs exists yet (ConfigMap, Secret, database), since
    # Helm creates ordinary resources only once hooks have finished. On an
    # upgrade everything is already running, so pre-upgrade lands the schema
    # before the new code rolls.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # Argo CD: an explicit hook annotation takes precedence over the Helm
    # mapping above. Without it Argo CD maps pre-upgrade to PreSync, which on
    # a FIRST sync runs before any ordinary resource exists -- the Job cannot
    # even create its pod ("serviceaccount turnstone not found") and the sync
    # waits forever (observed live). PostSync runs after the workloads are
    # healthy; the image entrypoint has already migrated by then, so this is
    # an idempotent re-run, not the gate.
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  # The database may still be initialising on a first install; this Job is
  # what waits for it, exiting non-zero until PostgreSQL accepts connections.
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "turnstone.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: {{ include "turnstone.serviceAccountName" . }}
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrate.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrate.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrate.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "turnstone.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - python
            - -m
            - turnstone.core.storage._migrate
          env:
            {{- include "turnstone.db.env" . | nindent 12 }}
{{- end }}
