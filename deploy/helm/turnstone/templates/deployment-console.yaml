apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "turnstone.fullname" . }}-console
  labels:
    {{- include "turnstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  {{- if eq (int .Values.console.replicas) 1 }}
  # The console registers itself under the fixed service_id "console" and
  # deregisters on shutdown. Under RollingUpdate the outgoing pod's
  # deregister runs *after* the incoming pod registers and deletes its
  # row -- and the heartbeat only touches last_heartbeat, so the row is
  # never recreated and the console stays invisible in the registry until
  # the next clean start. Recreate orders shutdown strictly before
  # startup. Only valid at one replica; see console.replicas.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "turnstone.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      {{- if .Values.config.file }}
      annotations:
        # The file is read at startup, so a changed text rolls the pods.
        checksum/config-file: {{ .Values.config.file | sha256sum }}
      {{- end }}
      labels:
        {{- include "turnstone.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
        {{- with .Values.console.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.console.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "turnstone.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.console.terminationGracePeriodSeconds }}
      {{- with .Values.console.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: {{ include "turnstone.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # command replaces the image's entrypoint, and with it entrypoint.sh,
          # whose migrations the service and the migrate Job already run; tini
          # is named here so that, as PID 1, it reaps orphaned processes, such
          # as the helpers a stdio MCP server leaves behind, and forwards
          # signals to the service.
          command:
            - tini
            - --
            - turnstone-console
            - --host=0.0.0.0
            - --port={{ .Values.console.service.port }}
          ports:
            - name: http
              containerPort: {{ .Values.console.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "turnstone.fullname" . }}-config
            - secretRef:
                name: {{ include "turnstone.llm.secretName" . }}
                optional: true
          env:
            {{- include "turnstone.db.env" . | nindent 12 }}
            # Self-registration URL for the service registry. Unlike a
            # server node the console is one logical endpoint behind its
            # Service, so the Service DNS name is correct here. Stops at
            # ".svc" rather than assuming a "cluster.local" DNS domain.
            - name: TURNSTONE_CONSOLE_URL
              value: "http://{{ include "turnstone.fullname" . }}-console.{{ .Release.Namespace }}.svc:{{ .Values.console.service.port }}"
            {{- if or .Values.config.file .Values.config.existingSecret }}
            - name: TURNSTONE_CONFIG
              value: /etc/turnstone/config.toml
            {{- end }}
            - name: TURNSTONE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "turnstone.auth.secretName" . }}
                  key: TURNSTONE_JWT_SECRET
            {{- with include "turnstone.oidc.env" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.console.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- with (include "turnstone.configFile.volumeMounts" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir:
            {{- with .Values.console.persistence.data.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- with (include "turnstone.configFile.volumes" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
