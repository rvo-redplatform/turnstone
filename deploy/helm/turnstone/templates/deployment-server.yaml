{{- $kind := .Values.server.workloadKind | default "Deployment" }}
{{- if not (or (eq $kind "Deployment") (eq $kind "StatefulSet")) }}
{{- fail (printf "server.workloadKind must be Deployment or StatefulSet, got %q" $kind) }}
{{- end }}
apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: {{ include "turnstone.fullname" . }}-server
  labels:
    {{- include "turnstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  {{- if eq $kind "StatefulSet" }}
  # Stable pod names (…-server-0..N-1) are the point of the StatefulSet: a
  # restarted node re-registers under the same TURNSTONE_NODE_ID. Pods are
  # independent nodes with no startup ordering, hence Parallel.
  serviceName: {{ include "turnstone.server.headlessServiceName" . }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  {{- else }}
  strategy:
    {{- toYaml .Values.server.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "turnstone.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      {{- if .Values.config.file }}
      annotations:
        # The file is read at startup, so a changed text rolls the pods.
        checksum/config-file: {{ .Values.config.file | sha256sum }}
      {{- end }}
      labels:
        {{- include "turnstone.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
        {{- with .Values.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.server.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "turnstone.serviceAccountName" . }}
      # The server runs model-chosen shell commands. Nothing in it needs the
      # Kubernetes API, so it must not hold a token that could reach it, with
      # or without sidecars (upstream re-mounts the token into the server
      # container when sidecars are on; this chart does not).
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds }}
      {{- with (include "turnstone.server.priorityClassName" .) }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if or .Values.imagePullSecrets .Values.server.imagePullSecrets }}
      # Chart-wide pull secrets (every pod) plus upstream's server-only list
      # for sidecar images.
      imagePullSecrets:
        {{- with .Values.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.server.imagePullSecrets }}
        {{- include "turnstone.server.imagePullSecrets" $ | trim | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.server.sidecars }}
      # MCP sidecars are started before the server and stopped after it; each
      # shares the workspace volume below. See values.yaml, server.sidecars.
      initContainers:
        {{- include "turnstone.server.sidecars" . | trim | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "turnstone.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # command replaces the image's entrypoint, and with it entrypoint.sh,
          # whose migrations the service and the migrate Job already run; tini
          # is named here so that, as PID 1, it reaps orphaned processes, such
          # as the helpers a stdio MCP server leaves behind, and forwards
          # signals to the service.
          command:
            - tini
            - --
            - turnstone-server
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.server.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "turnstone.fullname" . }}-config
            - secretRef:
                name: {{ include "turnstone.llm.secretName" . }}
                optional: true
          env:
            {{- include "turnstone.db.env" . | nindent 12 }}
            # Each replica is a distinct node in the rendezvous ring, so it
            # must advertise an address that reaches *itself*. The Service
            # DNS name would load-balance across every replica; the pod IP
            # is unique, routable in-cluster, and re-registered on every
            # start, so churn is self-healing.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TURNSTONE_ADVERTISE_URL
              value: "http://$(POD_IP):{{ .Values.server.service.port }}"
            {{- if or .Values.config.file .Values.config.existingSecret }}
            - name: TURNSTONE_CONFIG
              value: /etc/turnstone/config.toml
            {{- end }}
            - name: TURNSTONE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "turnstone.auth.secretName" . }}
                  key: TURNSTONE_JWT_SECRET
            {{- with include "turnstone.oidc.env" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if .Values.server.nodeIdFromPodName }}
            # Node identity = pod name. Without this the server derives
            # `{hostname}_{4hex}` with a fresh suffix on every start, which
            # nothing outside the pod can map back to it (the disruption
            # guard relies on this, and so does node affinity).
            - name: TURNSTONE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: workspace
              mountPath: /workspace
            {{- with (include "turnstone.configFile.volumeMounts" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir:
            {{- with .Values.server.persistence.data.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        # Always present; sidecars (server.sidecars) share it. The image names
        # /workspace in the model's tool descriptions (TURNSTONE_WORKSPACE).
        - name: workspace
          emptyDir:
            {{- with .Values.server.persistence.workspace.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- with (include "turnstone.configFile.volumes" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
